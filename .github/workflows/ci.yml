name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint & import check (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywinauto pyautogui ruff

      - name: Lint with ruff
        run: ruff check gui_detector.py gui_helper.py ExampleScripts/

      - name: Check formatting
        run: ruff format --check gui_detector.py gui_helper.py ExampleScripts/

      - name: Verify imports
        run: |
          python -c "import ast, sys, pathlib
          files = list(pathlib.Path('.').glob('*.py')) + list(pathlib.Path('ExampleScripts').glob('*.py'))
          errors = []
          for f in files:
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors:')
              for e in errors: print(' ', e)
              sys.exit(1)
          print(f'Parsed {len(files)} files OK')"

      - name: Import gui_helper
        run: python -c "import gui_helper; print('gui_helper OK')"

      - name: Import gui_detector (syntax check only)
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('gui_detector.py').read_text()); print('gui_detector syntax OK')"
