name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Run tests before release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build ruff

      - name: Lint before release
        run: ruff check src/ tests/

      - name: Build wheel and sdist
        run: python -m build

      - name: Zip source release
        run: |
          Compress-Archive -Path src, tests, docs, README.md, pyproject.toml, LICENSE `
            -DestinationPath pywin-gui-inspector-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            pywin-gui-inspector-${{ github.ref_name }}.zip
            dist/*.whl
            dist/*.tar.gz
