name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywinauto pyautogui ruff

      - name: Lint check before release
        run: ruff check gui_detector.py gui_helper.py ExampleScripts/

      - name: Zip release assets
        run: |
          Compress-Archive -Path gui_detector.py, gui_helper.py, ExampleScripts, README.md, requirements.txt `
            -DestinationPath pywin-gui-inspector-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: pywin-gui-inspector-${{ github.ref_name }}.zip
